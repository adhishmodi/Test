[project]
name = "intelligent-traffic-monitoring-backend"
version = "0.1.0"
description = "FastAPI backend for the Intelligent Traffic Monitoring System"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "fastapi==0.163.1",
  "pydantic-settings==2.16.3",
  "python-multipart>=0.0.20,<1.0",
  "redis>=6.0,<7.0",
  "rq==3.0.0",
  "sqlalchemy[asyncio]==2.1.9",
  "uvicorn[standard]>=0.54,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest==9.2.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
